name: Publish to PyPI

on:
  release:
    types: [published]  # Triggers only when you create a formal GitHub Release

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # Required for Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    # Optional: Match this to the environment name you set in PyPI
    environment:
      name: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1