site_name: LLM Jury Documentation
site_description: Multi-Model Consensus Evaluation Framework for LLM Outputs
site_author: LLM Jury Team

# Add these two lines at the top level
repo_url: https://github.com/netraj-patil/LLM-Jury
repo_name: LLM-Jury

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Docs:
      - Getting Started: docs/getting-started.md
      - Core Concepts: docs/core-concepts.md
      - Architecture: docs/architecture.md
      - Judges: docs/judges.md
      - Metrics: docs/metrics.md
      - Aggregation Strategies: docs/strategies.md
      - Feature Extraction: docs/features.md
      - Hallucination Shield: docs/shield.md
      - Examples: docs/examples.md
  - API Reference:
      - Overview: api/overview.md
      - Core:
          - JuryEvaluator: api/core/evaluator.md
          - Manifest & Results: api/core/manifest.md
      - Judges:
          - Base Judge: api/judges/base.md
          - LLM Judge: api/judges/llm_judge.md
      - Metrics:
          - Base Metric: api/metrics/base.md
          - Predefined Metrics: api/metrics/predefined.md
      - Strategies:
          - Base Strategy: api/strategies/base.md
          - Consensus: api/strategies/consensus.md
          - Weighted: api/strategies/weighted.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - toc:
      permalink: true
